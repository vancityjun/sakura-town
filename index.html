<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="css/style.css">
  <title>Sakura</title>
</head>
<body>
  <div class="loading">
    <div class="spinner" aria-hidden="true"></div>
    <h3 class="loading-title">Loading..</h3>
    <p class="loading-error" role="alert"></p>
    <div class="progress">
      <div class="progressBar"></div>
    </div>
    <!-- <p style="color:#fff;">사용자의 컴퓨터 사양에 따라 시간이 다소 소요될 수 있습니다.</p> -->
  </div>
  <div id="ui">
    <div id="toolbar">
      <div class="toolbar-group">
        <button id="transform-translate" type="button" class="toolbar-button is-active">Translate</button>
        <button id="transform-rotate" type="button" class="toolbar-button">Rotate</button>
      </div>
      <div class="toolbar-group">
        <button id="transform-undo" type="button" class="toolbar-button">Undo</button>
        <button id="transform-redo" type="button" class="toolbar-button">Redo</button>
      </div>
      <div class="toolbar-group">
        <button id="toggle-interaction" type="button" class="toolbar-button is-active">Selection: On</button>
      </div>
      <span id="selection-status">No selection</span>
    </div>
    <div id="pin-layer"></div>
    <aside id="comment-panel" aria-live="polite">
      <h3>Comments</h3>
      <div class="comment-form">
        <label class="comment-label" for="comment-input">New comment</label>
        <textarea id="comment-input" rows="3" placeholder="Add a comment for this selection..."></textarea>
        <div class="comment-actions">
          <button id="add-comment" type="button">Add comment</button>
          <button id="comment-clear" type="button" class="comment-secondary">Clear</button>
        </div>
      </div>
      <div id="comment-empty">No comments yet.</div>
      <ul id="comment-list"></ul>
      <div class="comment-detail">
        <h4>Selected</h4>
        <p id="comment-text">Select a pin to see details.</p>
      </div>
    </aside>
  </div>
  <script type="text/javascript" src="js/three.js"></script>
  <script type="text/javascript" src="js/WebGL.js"></script>
  <script type="text/javascript" src="js/Detector.js"></script>
  <script type="text/javascript" src="js/libs/stats.min.js"></script>
  <script type="text/javascript" src="js/controls/TrackballControls.js"></script>
  <script type="text/javascript" src="js/controls/OrbitControls.js"></script>
  <script type="text/javascript" src="js/controls/TransformControls.js"></script>
  <script type="text/javascript" src="js/OBJLoader.js"></script>
  <!-- <script type="text/javascript" src="js/OBJLoader2.js"></script> -->
  <script type="text/javascript" src="js/MTLLoader.js"></script>
  <script type="text/javascript" src="js/GLTFLoader.js"></script>
  <script type="text/javascript" src="js/LoaderSupport.js"></script>
  <script type="text/javascript" src="js/libs/dat.gui.min.js"></script>

</body>
